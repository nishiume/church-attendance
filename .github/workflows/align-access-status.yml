name: Apply access status alignment
"on":
  push:
    paths:
      - .github/workflows/align-access-status.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted CSS change
        run: >-
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); old="    .access-name-actions { display: flex; align-items: center; gap: 8px; }\n    .role-admin-row .access-name-actions span { flex: 0 1 auto; min-width: 0; }"; new="    .access-name-actions { display: grid; grid-template-columns: minmax(0, 1fr) 5.5em; align-items: center; gap: 8px; width: 100%; }\n    .role-admin-row .access-name-actions span { min-width: 0; }"; assert s.count(old)==1; s=s.replace(old,new); old2="    .access-status-select {\n      min-width: 7em;"; new2="    .access-status-select {\n      width: 5.5em;\n      min-width: 5.5em;"; assert s.count(old2)==1; s=s.replace(old2,new2); p.write_text(s)'
      - name: Verify scope
        run: >-
          python -c 'from pathlib import Path; s=Path("index.html").read_text(); assert "grid-template-columns: minmax(0, 1fr) 5.5em" in s; assert s.count("width: 5.5em;")>=1; assert "font-size" not in s[s.index(".access-status-select {"):s.index(".access-status-select--allowed")]; assert "select.addEventListener(\"change\"" in s'
      - name: Commit and self-delete
        run: >-
          git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add index.html && git rm .github/workflows/align-access-status.yml && git commit -m 'Align reception status controls' && git push