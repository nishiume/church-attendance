name: Patch attendance view
on:
  push:
    paths:
      - .github/workflows/patch-attendance-view.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          def rep(old,new):
              global s
              if old not in s: raise SystemExit('missing: '+old[:100])
              s=s.replace(old,new,1)
          rep('<button id="screen-switch" class="nav-button" type="button" disabled>管理画面</button>', '<button id="screen-switch" class="nav-button" type="button" disabled>来会状況</button>\n    <button id="admin-manage-button" class="nav-button" type="button" hidden>管理</button>')
          rep('<h1 id="admin-login-title">管理画面</h1>\n      <button id="admin-number" class="form-button reception-action" type="button">番号を入力する</button>\n      <p id="admin-number-message" class="message" role="alert" hidden></p>', '<h1 id="admin-login-title">管理</h1>\n      <button id="admin-number" class="form-button reception-action" type="button">番号を入力する</button>\n      <p id="admin-number-message" class="message" role="alert" hidden></p>\n      <nav id="protected-admin-menu" class="admin-menu" aria-label="管理メニュー" hidden>\n        <button id="open-access-admin" class="nav-button" type="button">受付者管理</button>\n        <button id="open-role-admin" class="nav-button" type="button">会員登録</button>\n      </nav>')
          rep('      <nav class="admin-menu" aria-label="管理メニュー">\n        <button id="open-access-admin" class="nav-button" type="button" hidden>受付者管理</button>\n        <button id="open-role-admin" class="nav-button" type="button" hidden>会員登録</button>\n      </nav>\n', '')
          rep('const screenSwitch = document.getElementById("screen-switch");', 'const screenSwitch = document.getElementById("screen-switch");\n    const adminManageButton = document.getElementById("admin-manage-button");')
          rep('      if (receptionHomeRequested || name === "adminLogin") {\n        masterCode = "";\n        sync.clearAdmin();\n      }', '      if (receptionHomeRequested) {\n        masterCode = "";\n        sync.clearAdmin();\n      }')
          rep('      if (name === "admin" && !adminAuthorized) name = "adminLogin";\n', '')
          rep('''      const managementContext = name === "accessAdmin" || name === "roleAdmin" || name === "admin" ||\n        name === "adminLogin" ||\n        name === "keypad" ||\n        (name === "confirmation" && confirmationOrigin === "admin");\n      screenSwitch.textContent = managementContext\n        ? "受付画面"\n        : "管理画面";''', '''      screenSwitch.textContent = name === "admin" ? "受付" : "来会状況";\n      adminManageButton.hidden = name !== "admin";''')
          rep('''      } else if (name === "admin") {\n        adminActionMessage.hidden = true;\n        adminActionMessage.textContent = "";\n        renderAdmin();\n        document.getElementById("admin-title").focus({ preventScroll: true });''', '''      } else if (name === "admin") {\n        adminActionMessage.hidden = true;\n        adminActionMessage.textContent = "";\n        void sync.loadAttendanceView().then(() => { if (currentScreen === "admin") renderAdmin(); }).catch(showAppError);\n        document.getElementById("admin-title").focus({ preventScroll: true });''')
          rep('''      } else if (name === "adminLogin") {\n        adminAuthorized = false;\n        clearAdminLogin();\n        adminNumberInput.focus({ preventScroll: true });''', '''      } else if (name === "adminLogin") {\n        clearAdminLogin();\n        adminNumberInput.hidden = adminAuthorized;\n        document.getElementById("protected-admin-menu").hidden = !adminAuthorized;\n        if (!adminAuthorized) adminNumberInput.focus({ preventScroll: true });''')
          rep('''        adminAuthorized = true;\n        showScreen("admin");''', '''        adminAuthorized = true;\n        showScreen("adminLogin");''')
          rep('''    function renderAdmin() {\n      document.getElementById("open-access-admin").hidden = !masterCode;\n      document.getElementById("open-role-admin").hidden = !masterCode;''', '''    function renderAdmin() {''')
          rep('''        lastDateCell.textContent = lastDate\n          ? `${Number(lastDate.slice(5, 7))}/${Number(lastDate.slice(8, 10))}`\n          : "";''', '''        lastDateCell.textContent = lastDate\n          ? `${Number(lastDate.slice(5, 7))}/${Number(lastDate.slice(8, 10))}（${Math.max(0, Math.round((new Date(`${selectedDate}T00:00:00+09:00`) - new Date(`${lastDate}T00:00:00+09:00`)) / 86400000))}日前）`\n          : "";''')
          rep('''        })), start, clearAdmin, loadAdmin,\n        verifyMaster:''', '''        })), start, clearAdmin, loadAdmin,\n        async loadAttendanceView() {\n          if (!authReady) throw new Error("not_ready");\n          const data = await rpc("attendance_view_snapshot");\n          memberCache = data.members;\n          adminHistory = new Map(data.attendance.map(row => [key(row), row]));\n          attendanceCache.forEach(row => adminHistory.set(key(row), row));\n          renderFromCache();\n        },\n        verifyMaster:''')
          rep('if (!authReady || !adminAuthorized || operationPending) return;\n      const start = periodStart.value;', 'if (!authReady || operationPending || currentScreen !== "admin") return;\n      const start = periodStart.value;')
          old='''    screenSwitch.addEventListener("click", () => {\n      if (!authReady || operationPending) return;\n      const leavingManagement = currentScreen === "accessAdmin" || currentScreen === "roleAdmin" || currentScreen === "admin" ||\n        currentScreen === "adminLogin" ||\n        currentScreen === "keypad" ||\n        (currentScreen === "confirmation" && confirmationOrigin === "admin");\n      if (leavingManagement) void sync.start();\n      else showScreen("adminLogin");\n    });'''
          new='''    adminManageButton.addEventListener("click", () => {\n      if (!authReady || operationPending || currentScreen !== "admin") return;\n      sync.clearAdmin();\n      showScreen("adminLogin");\n    });\n\n    screenSwitch.addEventListener("click", () => {\n      if (!authReady || operationPending) return;\n      if (currentScreen === "admin") showScreen("reception");\n      else showScreen("admin");\n    });'''
          rep(old,new)
          rep('document.getElementById("access-admin-back").addEventListener("click", () => showScreen("admin"));', 'document.getElementById("access-admin-back").addEventListener("click", () => showScreen("adminLogin"));')
          rep('document.getElementById("role-admin-back").addEventListener("click", () => showScreen("admin"));', 'document.getElementById("role-admin-back").addEventListener("click", () => showScreen("adminLogin"));')
          rep('if (adminAuthorized && currentScreen === "admin") renderAdmin();', 'if (currentScreen === "admin") renderAdmin();')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Separate attendance view from protected management"
          git push