name: Repair reception access search
on:
  push:
    paths:
      - .github/workflows/repair-access-search.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply stored replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-access-search.yml').read_text()
          marker = "replacement = '''"
          start = source.index(marker) + len(marker)
          end = source.index("\n          '''", start)
          lines = source[start:end].splitlines()
          replacement = '\n'.join([lines[0]] + [line[10:] if line.startswith('          ') else line for line in lines[1:]]) + '\n'
          p = Path('index.html')
          s = p.read_text()
          a = s.index('    let accessTab = "allowed";')
          b = s.index('    const sync = (() => {', a)
          p.write_text(s[:a] + replacement + s[b:])
          PY
      - name: Verify
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("index.html","utf8"); const m=[...s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]; fs.writeFileSync("/tmp/app.js",m[m.length-1][1]);'
          node --check /tmp/app.js
          grep -q 'access-member-search' index.html
          grep -q 'sync.setAccess(Number(selectedPerson.id), input.value.trim())' index.html
          ! grep -q '\["pastor", "officer"\].includes(person.role)' index.html
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-access-search.yml .github/workflows/repair-access-search.yml
          git commit -m "Add member search to reception access"
          git push origin main
