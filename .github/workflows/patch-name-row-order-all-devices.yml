name: Patch name row order all devices

on:
  push:
    paths:
      - .github/workflows/patch-name-row-order-all-devices.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = "    .name-options--rows .name-option {"
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one match, found {text.count(marker)}")
          insert = "    .name-options.name-options--rows {\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      grid-template-rows: repeat(5, auto);\n      grid-auto-flow: column;\n    }\n\n" + marker
          text = text.replace(marker, insert, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use same kana row order on all devices"
          git push
