name: Apply attendance status display
on:
  push:
    paths:
      - .github/workflows/apply-attendance-status.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update attendance status display
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          old = '''        if (arrived) {
            const status = document.createElement("span");
            status.className = "status status--arrived";
            status.textContent = "● 来会済み";
            statusCell.append(status);
          } else if (selectedDate === today) {
            const checkinButton = document.createElement("button");
            checkinButton.type = "button";
            checkinButton.className = "admin-checkin-button";
            checkinButton.textContent = "受付する";
            checkinButton.setAttribute("aria-label", `${person.name}さんを受付する`);
            checkinButton.addEventListener("click", () => selectPerson(person, "admin"));
            statusCell.append(checkinButton);
          } else {
            const status = document.createElement("span");
            status.className = "status status--waiting";
            status.textContent = "";
            statusCell.append(status);
          }
'''
          new = '''        if (arrived) {
            const status = document.createElement("span");
            status.className = "status status--arrived";
            status.textContent = "〇";
            statusCell.append(status);
          }
'''
          if s.count(old) != 1:
              raise SystemExit("target block mismatch")
          p.write_text(s.replace(old, new, 1))
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s, re.I)
          Path('/tmp/app.js').write_text(scripts[-1])
          assert 'status.textContent = "〇"' in s
          assert 'checkinButton.textContent = "受付する"' not in s
          ids = re.findall(r'\bid="([^"]+)"', s)
          assert len(ids) == len(set(ids))
          PY
          node --check /tmp/app.js
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-attendance-status.yml
          git commit -m "Simplify attendance status display"
          git push origin main
