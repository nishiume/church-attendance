name: Fix name heading overlap
on:
  push:
    paths:
      - .github/workflows/fix-name-heading-overlap.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal CSS fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''    .name-select-heading {\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);\n      align-items: center;\n      gap: 8px;\n      text-align: center;\n    }\n\n    .name-select-heading > span {\n      grid-column: 2;\n      min-width: 0;\n    }\n\n    .family-selection-button {\n      grid-column: 3;\n'''
          new = '''    .name-select-heading {\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) auto;\n      align-items: center;\n      gap: 12px;\n      text-align: center;\n    }\n\n    .name-select-heading > span {\n      grid-column: 1;\n      min-width: 0;\n    }\n\n    .family-selection-button {\n      grid-column: 2;\n'''
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit index and remove temporary workflow
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-name-heading-overlap.yml
          git add index.html
          git commit -m "Prevent name heading overlap"
          git push
