name: Apply mobile kana grid layout
on:
  push:
    paths:
      - .github/workflows/apply-mobile-kana-grid.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted CSS change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''      .name-options.name-options--rows {
        grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
        gap: clamp(8px, 2.5vw, 12px);
      }
      .name-options--rows .name-option {
        min-height: clamp(52px, 14vw, 68px);
        padding: clamp(6px, 2vw, 10px);
        font-size: clamp(1.05rem, 4.8vw, 1.6rem);
      }'''
          new = '''      .name-options.name-options--rows {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(5, auto);
        grid-auto-flow: column;
        gap: clamp(8px, 2.5vw, 12px);
      }
      .name-options--rows .name-option {
        min-height: clamp(64px, 16vw, 68px);
        padding: clamp(6px, 2vw, 10px);
        font-size: clamp(1.2rem, 5vw, 1.6rem);
      }'''
          if s.count(old) != 1:
              raise SystemExit(f'target mismatch: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify layout and syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          required = [
            'grid-template-columns: repeat(2, minmax(0, 1fr));',
            'grid-template-rows: repeat(5, auto);',
            'grid-auto-flow: column;',
            'min-height: clamp(64px, 16vw, 68px);',
            'font-size: clamp(1.2rem, 5vw, 1.6rem);',
            '{ label: "あ行"', '{ label: "か行"', '{ label: "さ行"', '{ label: "た行"', '{ label: "な行"',
            '{ label: "は行"', '{ label: "ま行"', '{ label: "や行"', '{ label: "ら行"', '{ label: "わ行"'
          ]
          for token in required:
              assert token in s, token
          assert 'repeat(auto-fit, minmax(64px, 1fr))' not in s
          ids = re.findall(r'\bid="([^"]+)"', s)
          assert len(ids) == len(set(ids))
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s, re.I)
          Path('/tmp/app.js').write_text(scripts[-1])
          PY
          node --check /tmp/app.js
      - name: Commit and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-mobile-kana-grid.yml
          git commit -m "Use two-column mobile kana grid"
          git push origin main
