name: Apply attendance status display
on:
  push:
    paths:
      - .github/workflows/apply-attendance-status.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update attendance status display
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('ICAgICAgICBpZiAoYXJyaXZlZCkgewogICAgICAgICAgY29uc3Qgc3RhdHVzID0gZG9jdW1lbnQuY3JlYXRlRWxlbWVudCgic3BhbiIpOwogICAgICAgICAgc3RhdHVzLmNsYXNzTmFtZSA9ICJzdGF0dXMgc3RhdHVzLS1hcnJpdmVkIjsKICAgICAgICAgIHN0YXR1cy50ZXh0Q29udGVudCA9ICLjgIciOwogICAgICAgICAgc3RhdHVzQ2VsbC5hcHBlbmQoc3RhdHVzKTsKICAgICAgICB9Cg==').decode()
          if s.count(old) != 1:
              raise SystemExit('target block mismatch')
          p.write_text(s.replace(old, new, 1))
          PY2
      - name: Verify
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s, re.I)
          Path('/tmp/app.js').write_text(scripts[-1])
          assert 'status.textContent = "〇"' in s
          assert 'checkinButton.textContent = "受付する"' not in s
          ids = re.findall(r'\bid="([^"]+)"', s)
          assert len(ids) == len(set(ids))
          PY2
          node --check /tmp/app.js
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-attendance-status.yml
          git commit -m "Simplify attendance status display"
          git push origin main
