name: Apply reception manager redesign
"on":
  push:
    paths:
      - .github/workflows/apply-access-manager.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted access manager change
        run: >-
          echo '' | base64 -d > /tmp/patch_access.py && python /tmp/patch_access.py
      - name: Verify syntax and scope
        run: |
          grep -Fq '>受付者管理</button>' index.html
          grep -Fq '<h1 id="access-admin-title">受付者管理</h1>' index.html
          grep -Fq '新規受付者登録' index.html
          grep -Fq '登録済み受付者' index.html
          grep -Fq 'access-status-select--allowed' index.html
          grep -Fq 'nextAllowed ? account.login_email : null' index.html
          ! grep -Fq 'data-access-tab' index.html
          ! grep -Fq 'accessTab' index.html
          python -c 'from pathlib import Path; import re; s=Path("index.html").read_text(); scripts=re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>",s,re.I); Path("/tmp/app.js").write_text(scripts[-1])'
          node --check /tmp/app.js
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-access-manager.yml
          git commit -m "Simplify reception manager"
          git push origin main
