name: Apply multiple reception nowrap once

on:
  push:
    paths:
      - '.github/workflows/nowrap-multiple-reception-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "      font-size: 0.95rem;\n      font-weight: 800;\n    }\n\n    .family-selection-button:hover,"
          new = "      font-size: 0.95rem;\n      font-weight: 800;\n      white-space: nowrap;\n    }\n\n    .family-selection-button:hover,"
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/nowrap-multiple-reception-once.yml
          git add index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep multiple reception label on one line"
          git push
