name: Remove redundant name entry
on:
  push:
    paths:
      - .github/workflows/remove-name-entry.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply minimal removal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
              ('    #open-name-selection,\n    #admin-number {', '    #admin-number {'),
              ('\n      <button id="open-name-selection" class="form-button reception-action" type="button">名前から受付</button>', ''),
              ('    const openNameSelection = document.getElementById("open-name-selection");\n', ''),
              ('\n    function openNameSelector() {\n      if (!receptionReady || operationPending) return;\n      renderNameRows();\n      showScreen("nameSelect");\n    }\n', '\n'),
              ('\n    openNameSelection.addEventListener("click", openNameSelector);\n', '\n'),
              ('      } else if (name === "reception") {\n        adminAuthorized = false;\n        selectedPerson = null;\n        openNameSelection.focus({ preventScroll: true });\n      } else if (name === "completion") {', '      } else if (name === "reception") {\n        adminAuthorized = false;\n        selectedPerson = null;\n      } else if (name === "completion") {'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'target mismatch count={count}: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify flow and syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          for token in ['open-name-selection', 'openNameSelection', 'openNameSelector']:
              assert token not in s, token
          assert 'if (receptionHomeRequested && receptionReady) {' in s
          assert 'renderNameRows();\n        name = "nameSelect";' in s
          assert 'completionTimer = setTimeout(() => showScreen("reception"), 2000);' in s
          assert 'function registerPersonImmediately(person)' in s
          assert 'async function registerAttendance()' in s
          ids = re.findall(r'\bid="([^"]+)"', s)
          assert len(ids) == len(set(ids))
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s, re.I)
          Path('/tmp/app.js').write_text(scripts[-1])
          PY
          node --check /tmp/app.js
      - name: Commit and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-name-entry.yml
          git commit -m "Remove redundant name reception entry"
          git push origin main
