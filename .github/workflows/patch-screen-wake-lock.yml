name: Patch screen wake lock

on:
  push:
    paths:
      - .github/workflows/patch-screen-wake-lock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = '''    window.addEventListener("pageshow", (event) => { if (event.persisted) void sync.start(); });


    updateClock();
'''
          replacement = '''    window.addEventListener("pageshow", (event) => { if (event.persisted) void sync.start(); });

    let screenWakeLock = null;
    async function requestScreenWakeLock() {
      if (!("wakeLock" in navigator) || document.visibilityState != "visible" || screenWakeLock) return;
      try {
        screenWakeLock = await navigator.wakeLock.request("screen");
        screenWakeLock.addEventListener("release", () => { screenWakeLock = null; }, { once: true });
      } catch (_) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") void requestScreenWakeLock();
    });
    window.addEventListener("pageshow", () => void requestScreenWakeLock());

    updateClock();
'''
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one marker, found {text.count(marker)}")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep screen awake while app is visible"
          git push
