name: Apply sticky multi check-in action
"on":
  push:
    paths:
      - .github/workflows/sticky-multi-checkin.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted CSS change
        run: >-
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); marker="    .name-selection-back { margin-top: 20px; }"; add=marker+"\n\n    #name-selection-confirm:not([hidden]) {\n      position: sticky;\n      bottom: 12px;\n      z-index: 10;\n      width: min(620px, 100%);\n      margin-left: auto;\n      margin-right: auto;\n    }"; assert s.count(marker)==1; s=s.replace(marker,add); p.write_text(s)'
      - name: Verify scope
        run: >-
          python -c 'from pathlib import Path; s=Path("index.html").read_text(); assert s.count("#name-selection-confirm:not([hidden])")==1; assert "position: sticky;" in s[s.index("#name-selection-confirm:not([hidden])"):s.index(".confirmation-name")]; assert "nameSelectionConfirm.hidden = !familySelectionMode;" in s; assert "nameSelectionConfirm.disabled = selectedPeople.length === 0;" in s; assert "id=\"name-selection-confirm\"" in s'
      - name: Commit and self-delete
        run: >-
          git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add index.html && git rm .github/workflows/sticky-multi-checkin.yml && git commit -m 'Keep multi check-in action in reach' && git push