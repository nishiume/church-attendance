name: Apply reception text sizing
"on":
  push:
    paths:
      - .github/workflows/enlarge-reception-text.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted CSS changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '''    .name-option:hover,
    .name-option:focus-visible { background: var(--primary-soft); }'''
          new = '''    .name-options--rows .name-option {
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      line-height: 1.2;
      white-space: nowrap;
    }

    .name-option:hover,
    .name-option:focus-visible { background: var(--primary-soft); }'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    .name-option--candidate {
      min-height: 72px;
      color: var(--text);
      font-size: 1.2rem;
      text-align: left;
    }'''
          new = '''    .name-option--candidate {
      min-height: 72px;
      color: var(--text);
      font-size: clamp(1.55rem, 4vw, 2rem);
      line-height: 1.25;
      text-align: left;
      white-space: nowrap;
    }'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    #keypad-back,
    #name-select-back {
      display: block;
      width: min(620px, 100%);
      min-height: 58px;
      margin: 16px auto 0;
    }'''
          new = '''    #keypad-back,
    #name-select-back {
      display: block;
      width: min(620px, 100%);
      min-height: 58px;
      margin: 16px auto 0;
    }

    #keypad-back,
    #name-select-back,
    #access-admin-back,
    #role-admin-back,
    #confirm-no {
      font-size: clamp(1.45rem, 3.2vw, 2rem);
      line-height: 1.2;
      white-space: nowrap;
    }'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''        font-size: clamp(1.2rem, 5vw, 1.6rem);'''
          new = '''        font-size: clamp(1.55rem, 6vw, 1.9rem);'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Verify targeted changes
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          required = [
            '.name-options--rows .name-option {',
            'font-size: clamp(1.8rem, 4vw, 2.2rem);',
            'font-size: clamp(1.55rem, 4vw, 2rem);',
            'font-size: clamp(1.45rem, 3.2vw, 2rem);',
            'font-size: clamp(1.55rem, 6vw, 1.9rem);',
            '#access-admin-back,',
            '#role-admin-back,',
            '#confirm-no {',
            'white-space: nowrap;'
          ]
          for token in required:
            assert token in s, token
          assert 'font-size: 1.2rem;' not in s[s.index('.name-option--candidate {'):s.index('.name-option--candidate {') + 220]
          assert 'font-size: clamp(1.2rem, 5vw, 1.6rem);' not in s
          assert 'grid-auto-flow: column;' in s
          assert 'grid-template-rows: repeat(5, auto);' in s
          PY
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/enlarge-reception-text.yml
          git commit -m "Enlarge reception selection text"
          git push origin main
