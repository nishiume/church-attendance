name: Apply reception access search flow
on:
  push:
    paths:
      - .github/workflows/apply-access-search.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update access administration flow
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          start = s.index('    let accessTab = "allowed";')
          end = s.index('    const sync = (() => {', start)
          replacement = '''    let accessTab = "allowed";
    let accessSelectedMemberId = null;
    function renderAccessAdmin() {
      const list = document.getElementById("access-admin-list");
      list.replaceChildren();
      if (!adminAuthorized) return;
      const accounts = new Map(sync.accounts().filter(row => row.allowed !== false).map(row => [String(row.member_id), row.login_email]));

      if (accessTab === "allowed") {
        SORTED_ROSTER.filter(person => accounts.has(person.id)).forEach(person => {
          const row = document.createElement("div"); row.className = "role-admin-row";
          const label = document.createElement("span"); label.textContent = person.name;
          const input = document.createElement("input"); input.type = "email";
          input.setAttribute("aria-label", `${person.name}のGoogleメール`);
          input.value = accounts.get(person.id) || ""; input.disabled = true;
          const button = document.createElement("button"); button.type = "button"; button.className = "nav-button";
          button.textContent = "許可を解除";
          button.addEventListener("click", async () => {
            if (operationPending || !adminAuthorized) return;
            setOperationPending(true); clearAppError();
            try { await sync.setAccess(Number(person.id), null); }
            catch (error) { showAppError(error); }
            finally { setOperationPending(false); renderAccessAdmin(); }
          });
          const nameActions = document.createElement("div");
          nameActions.className = "access-name-actions";
          nameActions.append(label, button);
          row.append(nameActions, input);
          list.append(row);
        });
        return;
      }

      const searchLabel = document.createElement("label");
      searchLabel.htmlFor = "access-member-search";
      searchLabel.textContent = "会員を検索";
      const searchInput = document.createElement("input");
      searchInput.id = "access-member-search";
      searchInput.type = "search";
      searchInput.autocomplete = "off";
      searchInput.placeholder = "氏名またはかなを入力";
      const results = document.createElement("div");

      const selectedPerson = SORTED_ROSTER.find(person => person.id === accessSelectedMemberId && !accounts.has(person.id));
      if (selectedPerson) {
        const selectedRow = document.createElement("div"); selectedRow.className = "role-admin-row";
        const label = document.createElement("span"); label.textContent = selectedPerson.name;
        const input = document.createElement("input"); input.type = "email";
        input.placeholder = "Googleメール";
        input.setAttribute("aria-label", `${selectedPerson.name}のGoogleメール`);
        const button = document.createElement("button"); button.type = "button"; button.className = "nav-button";
        button.textContent = "メールを登録して許可";
        button.addEventListener("click", async () => {
          if (operationPending || !adminAuthorized || !input.value.trim() || !input.reportValidity()) return;
          setOperationPending(true); clearAppError();
          try {
            await sync.setAccess(Number(selectedPerson.id), input.value.trim());
            accessSelectedMemberId = null;
            accessTab = "allowed";
            document.querySelectorAll("[data-access-tab]").forEach(item =>
              item.setAttribute("aria-pressed", String(item.dataset.accessTab === "allowed"))
            );
          } catch (error) { showAppError(error); }
          finally { setOperationPending(false); renderAccessAdmin(); }
        });
        selectedRow.append(label, input, button);
        list.append(selectedRow);
      }

      function renderSearchResults() {
        results.replaceChildren();
        const query = normalizeKanaForIndex(searchInput.value).toLocaleLowerCase("ja");
        if (!query) return;
        SORTED_ROSTER.filter(person => !accounts.has(person.id))
          .filter(person => {
            const name = String(person.name ?? "").normalize("NFKC").toLocaleLowerCase("ja");
            const kana = normalizeKanaForIndex(person.familyKana).toLocaleLowerCase("ja");
            return name.includes(query) || kana.includes(query);
          })
          .slice(0, 20)
          .forEach(person => {
            const row = document.createElement("div"); row.className = "role-admin-row";
            const label = document.createElement("span"); label.textContent = person.name;
            const button = document.createElement("button"); button.type = "button"; button.className = "nav-button";
            button.textContent = "選択";
            button.addEventListener("click", () => { accessSelectedMemberId = person.id; renderAccessAdmin(); });
            row.append(label, button);
            results.append(row);
          });
      }

      searchInput.addEventListener("input", renderSearchResults);
      list.append(searchLabel, searchInput, results);
    }
    document.querySelectorAll("[data-access-tab]").forEach(button => button.addEventListener("click", () => {
      accessTab = button.dataset.accessTab;
      accessSelectedMemberId = null;
      document.querySelectorAll("[data-access-tab]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
      renderAccessAdmin();
    }));

'''
          p.write_text(s[:start] + replacement + s[end:])
      - name: Verify targeted change
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("index.html","utf8"); const m=[...s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]; fs.writeFileSync("/tmp/app.js",m[m.length-1][1]);'
          node --check /tmp/app.js
          grep -q 'id = "access-member-search"' index.html
          grep -q 'sync.setAccess(Number(selectedPerson.id), input.value.trim())' index.html
          ! grep -q '\["pastor", "officer"\].includes(person.role)' index.html
      - name: Commit index and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-access-search.yml
          git commit -m "Add member search to reception access"
          git push origin main
