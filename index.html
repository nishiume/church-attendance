<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教会受付</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f3f6fb;
      --surface: #ffffff;
      --text: #1d2a3a;
      --muted: #667386;
      --line: #d7deea;
      --primary: #245da8;
      --primary-dark: #17457f;
      --primary-soft: #e7effa;
      --danger: #a43131;
      --danger-soft: #fff0f0;
      --radius: 18px;
      --shadow: 0 16px 40px rgba(29, 42, 58, 0.08);
    }

    * { box-sizing: border-box; }

    html {
      scrollbar-gutter: stable both-edges;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }

    button,
    input,
    select { font: inherit; }

    button {
      display: block;
      box-sizing: border-box;
      cursor: pointer;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: min(920px, calc(100% - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      margin: 0 auto;
      padding: 10px 0 0;
    }

    .nav-button {
      min-height: 44px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
    }

    .nav-button:hover,
    .nav-button:focus-visible { border-color: var(--primary); }

    main {
      width: min(920px, calc(100% - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      margin: 0 auto;
      padding: 8px 0 56px;
    }

    .panel {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel--wide { max-width: 920px; }


    [hidden] { display: none !important; }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.65rem, 5vw, 2.35rem);
      line-height: 1.3;
      text-align: center;
    }

    .reception-clock {
      display: flex;
      justify-content: center;
      gap: 0.5em;
      flex-wrap: nowrap;
      margin: 14px 0 8px;
      color: var(--primary-dark);
      font-size: clamp(0.75rem, 5.8cqw, 2rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .lead {
      margin: 0 0 30px;
      color: var(--muted);
      text-align: center;
    }

    /* Reception / keypad / name-selection shared visual baseline */
    #reception-panel,
    #keypad-panel,
    #name-select-panel,
    #admin-login-panel,
    #admin-panel {
      padding-top: 40px;
    }

    #reception-panel {
      container-type: inline-size;
    }

    #reception-panel h1,
    #keypad-panel h1,
    #name-select-panel h1,
    #admin-login-panel h1,
    #admin-panel > h1 {
      width: min(620px, 100%);
      margin: 0 auto 10px;
      font-size: clamp(2rem, 4vw, 2.35rem);
      font-weight: 800;
      line-height: 1.3;
      text-align: center;
    }

    #reception-panel .reception-clock,
    #keypad-panel .lead,
    #name-select-panel .lead {
      min-height: 1.8em;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    #reception-panel .reception-clock {
      font-size: clamp(0.75rem, 5.8cqw, 2.4rem);
    }

    #keypad-panel .lead,
    #name-select-panel .lead {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    #keypad-panel.keypad-panel--admin {
      padding-top: 20px;
      padding-bottom: 6px;
    }

    main.admin-keypad-active {
      padding-bottom: 0;
    }

    #keypad-panel.keypad-panel--admin h1 {
      margin-bottom: 6px;
      font-size: 1.8rem;
    }

    #keypad-panel.keypad-panel--admin .lead {
      min-height: 1.5em;
      margin-bottom: 10px;
    }

    #keypad-panel.keypad-panel--admin .keypad-display {
      height: 68px;
      margin: 8px auto;
      font-size: 2.1rem;
    }

    #keypad-panel.keypad-panel--admin .keypad-button--confirm {
      min-height: 52px;
      margin-bottom: 8px;
    }

    #keypad-panel.keypad-panel--admin .keypad {
      gap: 8px;
    }

    #keypad-panel.keypad-panel--admin .keypad-button {
      min-height: 54px;
      font-size: 1.55rem;
    }

    #keypad-panel.keypad-panel--admin .keypad-button--text {
      font-size: 0.95rem;
    }

    #keypad-panel.keypad-panel--admin .keypad-back {
      min-height: 44px;
      margin-top: 10px;
    }

    #keypad-back,
    #name-select-back {
      display: block;
      width: min(620px, 100%);
      min-height: 58px;
      margin: 16px auto 0;
    }

    #keypad-back,
    #name-select-back,
    #access-admin-back,
    #role-admin-back,
    #cancel-admin-back,
    #confirm-no {
      font-size: clamp(1.45rem, 3.2vw, 2rem);
      line-height: 1.2;
      white-space: nowrap;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 60px;
      padding: 11px 14px;
      border: 1px solid #aeb8b1;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 1.1rem;
    }

    input:focus {
      border-color: var(--primary);
      outline: 3px solid rgba(36, 93, 168, 0.16);
    }

    .role-select {
      min-width: 7em;
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid #aeb8b1;
      border-radius: 9px;
      background: #fff;
      color: var(--text);
    }

    .role-select:focus {
      border-color: var(--primary);
      outline: 3px solid rgba(36, 93, 168, 0.16);
    }

    #admin-panel .role-select {
      width: 100%;
      min-width: 0;
      padding: 3px 2px;
      font-size: 0.75rem;
    }

    input[readonly] { cursor: pointer; }

    .form-button,
    .action-button {
      min-height: 58px;
      border-radius: 10px;
      font-weight: 800;
    }

    .form-button {
      width: 100%;
      margin-top: 14px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .form-button:hover,
    .form-button:focus-visible,
    .action-button--primary:hover,
    .action-button--primary:focus-visible { background: var(--primary-dark); }

    .form-button--secondary {
      border-color: var(--primary);
      background: #fff;
      color: var(--primary-dark);
    }

    .form-button--secondary:hover,
    .form-button--secondary:focus-visible { background: var(--primary-soft); }

    .reception-action {
      min-height: 72px;
      font-size: 1.3rem;
    }

    #admin-number {
      display: block;
      width: min(620px, 100%);
      margin-left: auto;
      margin-right: auto;
      align-self: center;
    }

    #admin-login-panel #admin-number {
      width: min(527px, 85%);
    }

    #admin-login-panel {
      padding-top: 20px;
    }

    #admin-login-panel h1 {
      margin-bottom: 8px;
    }

    #admin-login-panel #admin-number {
      margin-top: 8px;
    }


    #admin-number {
      margin: 14px auto 0;
    }

    .message {
      margin: 20px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
      font-weight: 700;
    }

    .name-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .name-options--candidates { grid-template-columns: 1fr; }


    .name-option {
      min-height: 68px;
      padding: 10px 14px;
      border: 1px solid var(--primary);
      border-radius: 12px;
      background: #fff;
      color: var(--primary-dark);
      font-size: 1.8rem;
      font-weight: 800;
    }

    .name-options.name-options--rows {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(5, auto);
      grid-auto-flow: column;
    }

    .name-options--rows .name-option {
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      line-height: 1.2;
      white-space: nowrap;
    }

    .name-option:hover,
    .name-option:focus-visible { background: var(--primary-soft); }

    .name-option:disabled {
      border-color: var(--line);
      background: #f1f3f6;
      color: #8a939f;
      cursor: default;
    }

    .name-option--candidate {
      min-height: 72px;
      color: var(--text);
      font-size: clamp(1.55rem, 4vw, 2rem);
      line-height: 1.25;
      text-align: left;
      white-space: nowrap;
    }

    .name-option--candidate {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      cursor: pointer;
    }

    .name-option--candidate input {
      order: -1;
      width: 30px;
      min-width: 30px;
      height: 30px;
      min-height: 30px;
      margin: 0;
      accent-color: var(--primary);
    }

    .name-option--candidate:has(input:checked) {
      background: var(--primary-soft);
    }

    .name-select-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .name-select-heading > span {
      grid-column: 1;
      min-width: 0;
    }

    .family-selection-button {
      grid-column: 2;
      justify-self: end;
      min-height: 44px;
      padding: 7px 13px;
      border: 1px solid var(--primary);
      border-radius: 9px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 0.95rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .family-selection-button:hover,
    .family-selection-button:focus-visible { background: #d7e6f8; }

    .name-selection-back,
    .keypad-back {
      display: block;
      width: min(620px, 100%);
      margin-left: auto;
      margin-right: auto;
    }

    .name-selection-back { margin-top: 20px; }

    #name-selection-confirm:not([hidden]) {
      position: sticky;
      bottom: 12px;
      z-index: 10;
      width: min(620px, 100%);
      margin-left: auto;
      margin-right: auto;
    }

    .confirmation-name,
    .completion-name {
      margin: 28px 0;
      font-weight: 800;
      text-align: center;
    }

    .confirmation-name {
      font-size: clamp(1.55rem, 6vw, 2.3rem);
    }

    .completion-member-row {
      min-height: 60px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      text-align: center;
    }

    .confirmation-question {
      display: block;
      margin-top: 8px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .keypad-display {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 104px;
      margin: 24px 0;
      padding: 10px 16px;
      border: 2px solid var(--primary);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.18em;
      font-variant-numeric: tabular-nums;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .keypad-button {
      min-height: 76px;
      border: 1px solid #aeb8b1;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font-size: 2rem;
      font-weight: 800;
    }

    .keypad-button:hover,
    .keypad-button:focus-visible { background: var(--primary-soft); }

    .keypad-button--text { font-size: 1.05rem; }

    .keypad-button--confirm {
      display: block;
      width: min(620px, 100%);
      min-height: 76px;
      margin: 0 auto 12px;
      padding: 0;
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      font-size: 1.3rem;
      text-align: center;
    }

    .keypad-button--confirm:hover,
    .keypad-button--confirm:focus-visible { background: var(--primary-dark); }

    .keypad-button--confirm:disabled {
      border-color: var(--line);
      background: #dfe4ea;
      color: #77818d;
      cursor: default;
    }

    .keypad-back { margin-top: 14px; }

    .action-button { border: 1px solid var(--line); }

    .action-button--primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .action-button--secondary {
      background: #fff;
      color: var(--text);
    }

    .action-button--secondary:hover,
    .action-button--secondary:focus-visible { background: #f0f2f0; }

    .count-card {
      min-width: 0;
      padding: 14px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--primary-soft);
      text-align: center;
    }

    .count-cards {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: min(822px, 100%);
      margin: 20px auto 24px;
    }

    .count-card--total {
      grid-column: 1;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .admin-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: min(822px, 100%);
      margin: 18px auto 0;
    }

    #admin-panel .admin-controls,
    #admin-panel .period-export,
    #admin-panel .member-detail {
      margin-left: auto;
      margin-right: auto;
    }

    .admin-control label { text-align: center; }

    .admin-control select {
      width: 100%;
      height: 60px;
      min-height: 60px;
      padding: 11px 14px;
      border: 1px solid #aeb8b1;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    .admin-control select:focus {
      border-color: var(--primary);
      outline: 3px solid rgba(36, 93, 168, 0.16);
    }

    .admin-control input {
      width: 100%;
      height: 60px;
      min-height: 60px;
    }

    .admin-checkin-button {
      margin: 0 auto;
      min-height: 34px;
      padding: 4px 7px;
      border: 1px solid var(--primary);
      border-radius: 7px;
      background: var(--primary);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .admin-checkin-button:hover,
    .admin-checkin-button:focus-visible { background: var(--primary-dark); }

    .count-label {
      display: block;
      color: var(--muted);
      font-weight: 700;
    }

    .count-value {
      display: block;
      color: var(--primary-dark);
      font-size: 2.4rem;
      font-weight: 850;
      line-height: 1.3;
    }

    .table-wrap {
      overflow-x: hidden;
      border-top: 1px solid var(--line);
    }

    #admin-panel > h1 {
      margin-bottom: 6px;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th,
    td {
      padding: 8px 5px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.82rem;
    }

    /* Column identity, not position, controls widths so reordering columns does not break layout. */
    th[data-column="number"], td[data-column="number"] { width: 14%; }
    th[data-column="name"], td[data-column="name"] { width: 25%; }
    th[data-column="last-date"], td[data-column="last-date"] { width: 15%; }
    th[data-column="year-count"], td[data-column="year-count"] { width: 14%; }
    th[data-column="status"], td[data-column="status"] { width: 17%; }
    th[data-column="role"], td[data-column="role"] { width: 15%; }

    th {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status {
      display: inline-block;
      min-width: 0;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .status--arrived { color: var(--primary); }
    .status--waiting { color: var(--muted); }

    .member-name-button {
      width: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--primary-dark);
      font-weight: 800;
      text-align: left;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .member-name-button:hover,
    .member-name-button:focus-visible { color: var(--primary); }

    .member-detail {
      width: min(822px, 100%);
      margin: 28px auto 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .member-detail h2 {
      margin: 0 0 16px;
      text-align: center;
    }

    .member-detail-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .member-detail-count {
      margin: 24px 0 16px;
      color: var(--primary-dark);
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
    }

    .member-detail-dates {
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: center;
    }

    .member-detail-dates li {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .period-export {
      width: min(822px, 100%);
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .period-export h2 {
      margin: 0 0 16px;
      text-align: center;
    }

    .period-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .period-fields > div {
      min-width: 0;
    }

    .period-fields input,
    .period-fields select {
      width: 100%;
      height: 60px;
      min-height: 60px;
      padding: 11px 14px;
      border: 1px solid #aeb8b1;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 1.1rem;
    }

    .period-fields input:focus,
    .period-fields select:focus {
      border-color: var(--primary);
      outline: 3px solid rgba(36, 93, 168, 0.16);
    }

    .period-export .form-button {
      margin-top: 16px;
    }

    .export-message {
      margin: 16px 0 0;
      color: var(--primary-dark);
      text-align: center;
      font-weight: 700;
    }

    .export-message--error { color: var(--danger); }

    .panel:not(.panel--wide) > * {
      width: min(620px, 100%);
      margin-left: auto;
      margin-right: auto;
    }

    .panel:not(.panel--wide) > button {
      display: block;
    }

    @media (max-width: 560px) {
      .panel { padding: 24px 20px; }
      .actions { grid-template-columns: 1fr; }
      .period-fields { grid-template-columns: 1fr; }
      .member-detail-fields { grid-template-columns: 1fr; }
      .admin-controls { grid-template-columns: 1fr; }
      .count-cards { gap: 6px; }
      .count-card { padding: 10px 4px; }
      .count-label { font-size: 0.82rem; }
      .count-value { font-size: clamp(1.25rem, 7vw, 1.9rem); }
      .name-options { grid-template-columns: 1fr 1fr; }
      .name-select-heading > span { font-size: clamp(1.25rem, 5.8vw, 1.75rem); white-space: nowrap; }
      .name-options.name-options--rows {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(5, auto);
        grid-auto-flow: column;
        gap: clamp(8px, 2.5vw, 12px);
      }
      .name-options--rows .name-option {
        min-height: clamp(64px, 16vw, 68px);
        padding: clamp(6px, 2vw, 10px);
        font-size: clamp(1.55rem, 6vw, 1.9rem);
      }
      .name-options--candidates { grid-template-columns: 1fr; }
      th, td { padding: 12px 8px; }
    }
    button:disabled { cursor: default; opacity: 0.5; }
    #connection-controls { width: min(920px, calc(100% - 32px)); padding: 12px 20px; box-shadow: none; }
    #sync-status { margin: 0; text-align: center; }
    .role-admin-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .role-admin-row span { flex: 1; min-width: 160px; }
    .role-admin-row .role-admin-number { flex: 0 0 3ch; min-width: 3ch; text-align: left; font-variant-numeric: tabular-nums; }
    .role-admin-row .role-admin-name { flex: 1; min-width: 0; text-align: left; }
    .access-name-actions { display: grid; grid-template-columns: minmax(0, 1fr) 5.5em; align-items: center; gap: 8px; width: 100%; }
    .access-name-button { width: 100%; min-height: 0; padding: 0; border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 800; text-align: left; }
    .role-admin-row .access-name-actions span { min-width: 0; }
    .member-add-form { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .member-add-form .role-select { width: 100%; height: 60px; }
    .admin-menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: min(822px, 100%);

    function localDateKey(date) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(date);
      const value = (type) => parts.find((part) => part.type === type).value;
      return `${value("year")}-${value("month")}-${value("day")}`;
    }

    function dateKeyBefore(dateKey, years = 0, months = 0) {
      const [year, month, day] = dateKey.split("-").map(Number);
      const first = new Date(Date.UTC(year - years, month - 1 - months, 1));
      const last = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0));
      first.setUTCDate(Math.min(day, last.getUTCDate()));
      return first.toISOString().slice(0, 10);
    }

      return Object.fromEntries(ROSTER.map((person) => [person.id, person.role]));

      const now = new Date();
      currentDate.textContent = DATE_FORMATTER.format(now);
      currentTime.textContent = TIME_FORMATTER.format(now);
      currentTime.dateTime = now.toISOString();
      const today = localDateKey(now);
      historyDate.max = today;
      periodStart.max = today;
      periodEnd.max = today;
      cancelDate.max = today;
      if (!periodEnd.value) periodEnd.value = today;
      if (!cancelDate.value) cancelDate.value = today;
    }

    async function processAdminNumber(enteredNumber) {
      if (!authReady || operationPending) return;
      setOperationPending(true);
      const epoch = sync.epoch;
      try {
        const authorized = await sync.verifyMaster(enteredNumber);
        if (!authReady || epoch !== sync.epoch || currentScreen !== "keypad") return;
        if (!authorized) {
          showScreen("adminLogin");
          adminNumberMessage.textContent = "管理画面を表示できません";
          adminNumberMessage.hidden = false;
          return;
        }
        masterCode = enteredNumber;
        await sync.loadAdmin();
        if (!authReady || epoch !== sync.epoch) return;
        adminAuthorized = true;
        showScreen("adminLogin");
      } catch (error) {
        showAppError(error);
      } finally {
        enteredNumber = "";
        setOperationPending(false);
      }
    }

    function normalizeKanaForIndex(value) {
      return String(value ?? "")
        .trim()
        .normalize("NFKC")
        .replace(/[\u30A1-\u30F6]/g, (character) =>
          String.fromCharCode(character.charCodeAt(0) - 0x60))
        .normalize("NFD")
        .replace(/[\u3099\u309A]/g, "")
        .normalize("NFC");
    }

    function surnameInitial(person) {
      return [...normalizeKanaForIndex(person.familyKana)][0] || "";
    }

        .filter((person) => surnameInitial(person) === selectedKana)
        .forEach((person) => {
          if (!familySelectionMode) {
            nameOptions.append(createNameOption(
              `${person.name}さん`,

          const option = document.createElement("label");

          option.className = "name-option name-option--candidate";

          checkbox.value = person.id;
          checkbox.setAttribute("aria-label", `${person.name}さんを受付対象にする`);

    async function registerAttendance() {
      if (!authReady || operationPending || !selectedPerson || !receptionReady) return;
      const people = [...(selectedPeople.length ? selectedPeople : [selectedPerson])];
      const epoch = sync.epoch;
      setOperationPending(true);
      clearAppError();
      try {
        const results = await sync.checkIn(people.map((person) => Number(person.id)));
        if (!authReady || epoch !== sync.epoch) return;
        const registrationResults = people.map((person) => ({
          person, alreadyRegistered: results.find((result) => String(result.member_id) === person.id).status === "already_registered"
        }));
        selectedPerson = null;
        selectedPeople = [];
        completionName.replaceChildren(...registrationResults.map((result) => {
          const row = document.createElement("div");
          row.className = "completion-member-row";
          row.textContent = `${result.person.name}さん：${result.alreadyRegistered ? "来会済みです" : "受付しました"}`;
          return row;
        }));
        showScreen("completion");
      } catch (error) {
        showAppError(error);
      } finally {
        setOperationPending(false);
      }
    }

    function exportPeriodCsv() {
      if (!authReady || operationPending || currentScreen !== "admin") return;
      const start = periodStart.value;
      const end = periodEnd.value;
      const selectedCategory = periodCategory.value;

      if (!start || !end) {
        showExportMessage("開始日と終了日を入力してください", true);
        return;
      }

      if (start > end) {
        showExportMessage("開始日は終了日以前にしてください", true);
        return;
      }

      const summaries = new Map();
      loadHistory().forEach((record) => {
        const date = record.attendanceDate;
        if (date < start || date > end) return;
        if (selectedCategory === "member" && record.categoryAtAttendance !== "member") return;
        if (selectedCategory === "guest" && !["guest", "child"].includes(record.categoryAtAttendance)) return;
        const summary = summaries.get(record.memberId) || { lastDate: "", count: 0 };
        summary.lastDate = date > summary.lastDate ? date : summary.lastDate;
        summary.count += 1;
        summaries.set(record.memberId, summary);
      });
      const targetRoster = SORTED_ROSTER.filter((person) => summaries.has(person.id));

      const rows = [
        ["個人番号", "氏名", "最終来会日", "期間内出席回数"],
        ...targetRoster.map((person) => {
          const summary = summaries.get(person.id);
          return [person.id, person.name, summary.lastDate, summary.count];
        })
      ];
      const csv = `\uFEFF${rows.map((row) => row.map(csvCell).join(",")).join("\r\n")}`;
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      const categoryLabel = selectedCategory === "guest" ? "ゲスト" :
        selectedCategory === "member" ? "教会員" : "全員";
      link.download = `来会集計_${categoryLabel}_${start}_${end}.csv`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      showExportMessage("CSVを出力しました");
    }

      const registeredTitle = document.createElement("h2");
      registeredTitle.textContent = "登録済み受付者";
      list.append(registeredTitle);

      const registeredPeople = [
        ...SORTED_ROSTER.filter(person => accounts.get(person.id)?.allowed !== false && accounts.has(person.id)),
        ...SORTED_ROSTER.filter(person => accounts.get(person.id)?.allowed === false)
      ];

      registeredPeople.forEach(person => {
        const account = accounts.get(person.id);
        const allowed = account.allowed !== false;
        const row = document.createElement("div");
        row.className = "role-admin-row";

        const label = document.createElement("button");
        label.type = "button";
        label.className = "access-name-button";
        label.textContent = person.name;
        label.setAttribute("aria-expanded", "false");

        const input = document.createElement("input");
        input.type = "email";
        input.value = account.login_email || "";
        input.disabled = true;
        input.hidden = true;
        input.setAttribute("aria-label", `${person.name}のGoogleメール`);
        label.addEventListener("click", () => {
          input.hidden = !input.hidden;
          label.setAttribute("aria-expanded", String(!input.hidden));
        });

        const select = document.createElement("select");
        select.className = `role-select access-status-select${allowed ? " access-status-select--allowed" : ""}`;
        select.setAttribute("aria-label", `${person.name}の受付許可状態`);
        const allowedOption = document.createElement("option");
        allowedOption.value = "allowed";
        allowedOption.textContent = "許可";
        const unallowedOption = document.createElement("option");
        unallowedOption.value = "unallowed";
        unallowedOption.textContent = "未許可";
        select.append(allowedOption, unallowedOption);
        select.value = allowed ? "allowed" : "unallowed";
        select.addEventListener("change", async () => {
          if (operationPending || !adminAuthorized) return;
          const nextAllowed = select.value === "allowed";
          setOperationPending(true);
          clearAppError();
          try {
            await sync.setAccess(Number(person.id), nextAllowed ? account.login_email : null);
          } catch (error) {
            showAppError(error);
          } finally {
            setOperationPending(false);
            renderAccessAdmin();
          }
        });

        const nameActions = document.createElement("div");
        nameActions.className = "access-name-actions";
        nameActions.append(label, select);
        row.append(nameActions, input);
        list.append(row);
      });
    }
    const sync = (() => {
      let client = null, epoch = 0, channel = null, retryTimer = null, day = "";
      let buffering = false, buffer = [], memberCache = [], attendanceCache = new Map(), accounts = [];
      let adminHistory = null, refreshing = false, sessionUserId = null;
      const key = row => `${row.member_id}:${row.attendance_date}`;
      const definitiveWriteErrors = new Set([
        "auth_denied", "reception_denied", "master_denied", "sunday_only",
        "invalid_member", "invalid_role", "invalid_email", "email_in_use",
        "invalid_member_data", "member_id_in_use", "not_ready"
      ]);
      const current = token => token === epoch;
      function status(message, checking = false) {
        syncStatus.textContent = message;
        connectionControls.hidden = authReady;
        loginButton.hidden = authReady || checking;
        logoutButton.hidden = !authReady;
        retryButton.hidden = !authReady;
        setOperationPending(operationPending);
      }
      function clearAdmin() {
        adminAuthorized = false; masterCode = ""; adminHistory = null; accounts = [];
        selectedMemberDetail = null; memberDetail.hidden = true;
        attendanceList.replaceChildren(); document.getElementById("access-admin-list").replaceChildren();
        document.getElementById("role-admin-list").replaceChildren();
        if (!receptionReady) { memberCache = []; attendanceCache.clear(); }
        renderFromCache();
      }
      function clearData() {
        receptionReady = false; memberCache = []; attendanceCache.clear(); buffer = [];
        selectedPerson = null; selectedPeople = []; clearAdmin();
      }
      function stop(message, retry = false) {
        ++epoch; clearTimeout(retryTimer); authReady = false; clearData();
        if (channel && client) void client.removeChannel(channel); channel = null;
        status(message, retry); showScreen("reception");
        retryButton.hidden = false;
        if (retry && navigator.onLine) retryTimer = setTimeout(start, 3000);
      }
      async function rpc(name, args = {}) {
        const token = epoch;
        const { data, error } = await client.rpc(name, args);
        if (!current(token)) throw new Error("not_ready");
        if (error) {
          if (error.message === "auth_denied") stop("Googleでログインしてください。");
          if (error.message === "reception_denied") {
            receptionReady = false; attendanceCache.clear();
            if (!adminAuthorized) { memberCache = []; renderFromCache(); showScreen("reception"); }
            status("受付資格がありません。管理画面は利用できます。");
          }
          if (error.message === "master_denied") { clearAdmin(); showScreen("adminLogin"); }
          throw error;
        }
        return data;
      }
      async function writeRpc(name, args = {}, validate = () => true) {
        const token = epoch;
        let lastError = null;
        for (let attempt = 0; attempt < 2; attempt += 1) {
          try {
            const data = await rpc(name, args);
            if (!current(token) || !authReady) throw new Error("not_ready");
            if (!validate(data)) throw new Error("invalid_response");
            return data;
          } catch (error) {
            lastError = error;
            if (definitiveWriteErrors.has(error?.message) || !current(token) || !authReady) throw error;
            if (attempt === 0) {
              if (navigator.onLine) continue;
              break;
            }
          }
        }
        if (current(token) && authReady) stop("処理結果を再取得しています。", true);
        throw lastError || new Error("invalid_response");
      }
      async function timedFetch(input, init = {}) {
        const controller = new AbortController(); const abort = () => controller.abort();
        const signal = init.signal || input?.signal;
        if (signal?.aborted) abort();
        signal?.addEventListener("abort", abort, { once: true });
        const timer = setTimeout(abort, 15000);
        try { return await fetch(input, { ...init, signal: controller.signal }); }
        finally { clearTimeout(timer); signal?.removeEventListener("abort", abort); }
      }
      function initializeClient() {
        if (client) return true;
        if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY || !window.supabase) {
          status("接続設定または接続プログラムを確認してください。"); return false;
        }
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" },
          global: { fetch: timedFetch }
        });
        client.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT") { sessionUserId = null; stop("Googleでログインしてください。"); }
          if (event === "SIGNED_IN" && session?.user.id !== sessionUserId) {
            sessionUserId = session?.user.id;
            setTimeout(() => void start(), 0);
          }
          if (event === "TOKEN_REFRESHED" && session) {
            setTimeout(() => {
              void client.realtime.setAuth(session.access_token).catch(() => {}).then(() => refresh());
            }, 0);
          }
        });
        return true;
      }
      function merge(row) {
        if (row.attendance_date === day) attendanceCache.set(key(row), row);
        if (adminHistory) adminHistory.set(key(row), row);
      }
      async function subscribe(token) {
        buffering = true; buffer = [];
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error("realtime_timeout")), 15000);
          const activeChannel = client.channel(`attendance-${token}`)
            .on("postgres_changes", { event: "INSERT", schema: "public", table: "attendance", filter: `attendance_date=eq.${day}` }, payload => {
              if (!current(token)) return;
              if (buffering) buffer.push(payload.new); else { merge(payload.new); renderFromCache(); }
            }).subscribe(state => {
              if (!current(token) || channel !== activeChannel) { clearTimeout(timer); reject(new Error("not_ready")); return; }
              if (state === "SUBSCRIBED") { clearTimeout(timer); resolve(); }
              else if (["CHANNEL_ERROR", "TIMED_OUT", "CLOSED"].includes(state)) {
                clearTimeout(timer); reject(new Error("realtime_disconnected"));
              }
            });
          channel = activeChannel;
        });
      }
      async function start() {
        const token = ++epoch; clearTimeout(retryTimer);
        authReady = false; clearData(); status("接続を確認しています", true); showScreen("reception");
        try {
          if (!initializeClient()) return;
          const old = channel; channel = null;
          if (old) await client.removeChannel(old);
          if (!current(token)) return;
          const { data, error } = await client.auth.getSession();
          if (!current(token)) return;
          if (error) throw error;
          if (!data.session) { status("Googleでログインしてください。"); return; }
          sessionUserId = data.session.user.id;
          const permitted = await rpc("reception_status");
          if (!current(token)) return;
          authReady = true; day = localDateKey(new Date());
          if (!permitted) {
            status("受付資格がありません。管理画面は利用できます。"); return;
          }
          const snapshot = await rpc("reception_snapshot");
          if (!current(token)) return;
          if (snapshot.today !== day) { void start(); return; }
          memberCache = snapshot.members;
          attendanceCache = new Map(snapshot.attendance.map(row => [key(row), row]));
          buffer.forEach(merge); buffer = []; buffering = false;
          receptionReady = true; renderFromCache(); status("接続済み"); showScreen("reception");
          void client.realtime.setAuth(data.session.access_token).then(() => subscribe(token)).catch(() => {
            buffering = false; buffer = [];
            if (channel && current(token)) {
              const old = channel; channel = null; void client.removeChannel(old);
            }
          });
        } catch (error) {
          if (current(token)) { stop("接続を確認できません。再接続してください。"); showAppError(error); }
        }
      }
      async function loadAdmin() {
        if (!authReady || !masterCode) throw new Error("not_ready");
        const code = masterCode;
        const data = await rpc("admin_snapshot", { p_master_code: code });
        if (masterCode !== code) throw new Error("not_ready");
        memberCache = data.members; accounts = data.access_accounts;
        adminHistory = new Map(data.attendance.map(row => [key(row), row]));
        attendanceCache.forEach(row => adminHistory.set(key(row), row));
        renderFromCache();
      }
      async function loadReceptionSnapshot() {
        if (!authReady || !receptionReady) throw new Error("not_ready");
        const snapshot = await rpc("reception_snapshot");
        if (snapshot.today !== day || !Array.isArray(snapshot.members) || !Array.isArray(snapshot.attendance)) throw new Error("invalid_response");
        const previous = new Map(memberCache.map(member => [member.member_id, member]));
        const membersChanged = snapshot.members.length !== memberCache.length || snapshot.members.some(member => {
          const old = previous.get(member.member_id);
          return !old || old.name !== member.name || old.family_kana !== member.family_kana || old.role !== member.role;
        });
        memberCache = snapshot.members;
        attendanceCache = new Map(snapshot.attendance.map(row => [key(row), row]));
        if (adminHistory) {
          [...adminHistory.entries()].forEach(([recordKey, row]) => {
            if (row.attendance_date === day) adminHistory.delete(recordKey);
          });
          snapshot.attendance.forEach(row => adminHistory.set(key(row), row));
        }
        renderFromCache();
        if (membersChanged && currentScreen === "nameSelect" && !familySelectionMode) {
          if (nameSelectionStage === "candidates" && selectedKana) renderNameCandidates();
          else if (nameSelectionStage === "characters" && selectedKanaRow) renderNameCharacters();
        }
      }
      async function loadAdminToday() {
        if (!authReady || !masterCode || !adminHistory) throw new Error("not_ready");
        const code = masterCode;
        const rows = await rpc("admin_today_attendance", { p_master_code: code });
        if (masterCode !== code || !Array.isArray(rows)) throw new Error("invalid_response");
        rows.forEach(merge);
        renderFromCache();
      }
      async function refresh() {
        if (!authReady || operationPending || refreshing) return;
        refreshing = true;
        try {
          if (day !== localDateKey(new Date())) { await start(); return; }
          const allowed = await rpc("reception_status");
          if (allowed !== receptionReady && !adminAuthorized) { await start(); return; }
          if (!allowed && receptionReady) {
            receptionReady = false; attendanceCache.clear();
            const old = channel; channel = null;
            if (old) await client.removeChannel(old);
          }
          if (receptionReady) await loadReceptionSnapshot();
          else if (adminAuthorized) await loadAdminToday();
        } catch (error) { stop("接続を再確認してください。"); showAppError(error); }
        finally { refreshing = false; }
      }
      setInterval(() => void refresh(), 30000);
      window.addEventListener("focus", () => void refresh());
      return {
        get epoch() { return epoch; },
        members: () => memberCache,
        accounts: () => accounts,
        history: () => [...(adminHistory || attendanceCache).values()].map(row => ({
          memberId: String(row.member_id), attendanceDate: row.attendance_date,
          attendedAt: row.attended_at, categoryAtAttendance: row.category_at_attendance
        })), start, clearAdmin, loadAdmin,
        async loadAttendanceView() {
          if (!authReady) throw new Error("not_ready");
          const data = await rpc("attendance_view_snapshot");
          memberCache = data.members;
          adminHistory = new Map(data.attendance.map(row => [key(row), row]));
          attendanceCache.forEach(row => adminHistory.set(key(row), row));
          renderFromCache();
        },
        verifyMaster: code => rpc("verify_master", { p_master_code: code }),
        async checkIn(ids) {
          if (!authReady || !receptionReady) throw new Error("not_ready");
          const validate = rows => Array.isArray(rows) && ids.every(id => rows.some(row =>
            row.member_id === id && ["inserted", "already_registered"].includes(row.status)));
          const rows = await writeRpc("check_in", { p_member_ids: ids }, validate);
          rows.forEach(merge); renderFromCache(); return rows;
        },
        async cancelAttendance(code, id, date) {
          const deleted = await writeRpc("cancel_attendance", {
            p_master_code: code, p_member_id: id, p_attendance_date: date
          }, value => typeof value === "boolean");
          await loadAdmin();
          return deleted;
        },
        async addMember(code, id, name, familyKana, role) {
          const validate = rows => Array.isArray(rows) && rows.length === 1 && Number(rows[0].member_id) === id;
          await writeRpc("add_member", {
            p_master_code: code, p_member_id: id, p_name: name, p_family_kana: familyKana, p_role: role
          }, validate);
          await loadAdmin();
        },
        async setRole(code, id, role) {
          await writeRpc("set_role", { p_master_code: code, p_member_id: id, p_new_role: role });
          await loadAdmin();
        },
        async setAccess(id, email) {
          await writeRpc(email === null ? "remove_access_account" : "set_access_account", {
            p_master_code: masterCode, p_member_id: id, ...(email === null ? {} : { p_login_email: email })
          });
          await loadAdmin();
        },
        async signIn() {
          if (!initializeClient()) return;
          const { error } = await client.auth.signInWithOAuth({ provider: "google", options: {
            redirectTo: location.origin + location.pathname, queryParams: { prompt: "select_account" }
          }});
          if (error) throw error;
        },
        async signOut() {
          if (!client) return;
          stop("ログアウトしています。");
          const { error } = await client.auth.signOut();
          if (error) throw error;
          status("Googleでログインしてください。");
        },
        offline: () => stop("通信が切れています。受付は停止中です。")
      };
    })();
    loginButton.addEventListener("click", async () => {
      clearAppError(); loginButton.disabled = true;
      try { await sync.signIn(); } catch (error) { showAppError(error); }
      finally { loginButton.disabled = false; }
    });
    logoutButton.addEventListener("click", async () => {
      try { await sync.signOut(); } catch (error) { showAppError(error); }
    });
    retryButton.addEventListener("click", () => { clearAppError(); void sync.start(); });
    window.addEventListener("offline", sync.offline);
    window.addEventListener("online", () => void sync.start());
    window.addEventListener("pageshow", (event) => { if (event.persisted) void sync.start(); });

    let screenWakeLock = null;
    async function requestScreenWakeLock() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible" || screenWakeLock) return;
      try {
        screenWakeLock = await navigator.wakeLock.request("screen");
        screenWakeLock.addEventListener("release", () => { screenWakeLock = null; }, { once: true });
      } catch (_) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") void requestScreenWakeLock();
    });
    window.addEventListener("pageshow", () => void requestScreenWakeLock());

    updateClock();
    historyDate.value = localDateKey(new Date());
    setInterval(updateClock, 1000);
    sync.start();
  </script>
</body>
</html>
