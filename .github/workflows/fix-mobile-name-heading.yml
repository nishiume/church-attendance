name: Keep mobile name heading on one line
"on":
  push:
    paths:
      - .github/workflows/fix-mobile-name-heading.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted CSS change
        run: >-
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); a="      .name-options { grid-template-columns: 1fr 1fr; }"; b=a+"\n      .name-select-heading > span { font-size: clamp(1.25rem, 5.8vw, 1.75rem); white-space: nowrap; }"; assert s.count(a)==1; s=s.replace(a,b,1); p.write_text(s)'
      - name: Verify targeted change
        run: |
          grep -Fq '.name-select-heading > span { font-size: clamp(1.25rem, 5.8vw, 1.75rem); white-space: nowrap; }' index.html
          grep -Fq 'grid-auto-flow: column;' index.html
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-mobile-name-heading.yml
          git commit -m "Keep mobile name heading on one line"
          git push origin main
