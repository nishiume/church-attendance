name: Patch member sort
on:
  push:
    paths:
      - .github/workflows/patch-role-sort.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          def rep(old,new):
              global s
              if old not in s: raise SystemExit('missing: '+old[:100])
              s=s.replace(old,new,1)
          rep('''        <div class="admin-control">\n          <label for="admin-sort">並び順</label>\n          <select id="admin-sort">\n            <option value="kana">50音順</option>\n            <option value="number">番号順</option>\n          </select>\n        </div>\n''','')
          rep('''      <h1 id="role-admin-title">会員登録</h1>\n      <form id="member-add-form" class="member-add-form" novalidate>''','''      <h1 id="role-admin-title">会員登録</h1>\n      <div class="admin-control">\n        <label for="role-admin-sort">並び順</label>\n        <select id="role-admin-sort">\n          <option value="kana">50音順</option>\n          <option value="number">番号順</option>\n        </select>\n      </div>\n      <form id="member-add-form" class="member-add-form" novalidate>''')
          rep('''      const displayedRoster = adminSort.value === "number"\n        ? [...ROSTER].sort((a, b) => Number(a.id) - Number(b.id))\n        : SORTED_ROSTER;''','''      const displayedRoster = SORTED_ROSTER;''')
          rep('''    adminSort.addEventListener("change", renderAdmin);\n''','')
          rep('''      SORTED_ROSTER.forEach((person) => {''','''      const roleAdminSort = document.getElementById("role-admin-sort");\n      const displayedRoster = roleAdminSort.value === "number"\n        ? [...ROSTER].sort((a, b) => Number(a.id) - Number(b.id))\n        : SORTED_ROSTER;\n      displayedRoster.forEach((person) => {''')
          rep('''    document.getElementById("open-access-admin").addEventListener("click", () => {''','''    document.getElementById("role-admin-sort").addEventListener("change", renderRoleAdmin);\n    document.getElementById("open-access-admin").addEventListener("click", () => {''')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Move sorting to member registration"
          git push