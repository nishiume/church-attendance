name: Apply mobile kana grid layout
"on":
  push:
    paths:
      - .github/workflows/apply-mobile-kana-grid.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted CSS change
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); a="        grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));"; b="        grid-template-columns: repeat(2, minmax(0, 1fr));\n        grid-template-rows: repeat(5, auto);\n        grid-auto-flow: column;"; assert s.count(a)==1; s=s.replace(a,b,1); c="        min-height: clamp(52px, 14vw, 68px);"; d="        min-height: clamp(64px, 16vw, 68px);"; assert s.count(c)==1; s=s.replace(c,d,1); e="        font-size: clamp(1.05rem, 4.8vw, 1.6rem);"; f="        font-size: clamp(1.2rem, 5vw, 1.6rem);"; assert s.count(e)==1; s=s.replace(e,f,1); p.write_text(s)'
      - name: Verify targeted layout
        run: |
          grep -Fq 'grid-template-columns: repeat(2, minmax(0, 1fr));' index.html
          grep -Fq 'grid-template-rows: repeat(5, auto);' index.html
          grep -Fq 'grid-auto-flow: column;' index.html
          grep -Fq 'min-height: clamp(64px, 16vw, 68px);' index.html
          grep -Fq 'font-size: clamp(1.2rem, 5vw, 1.6rem);' index.html
          ! grep -Fq 'repeat(auto-fit, minmax(64px, 1fr))' index.html
          grep -Fq '{ label: "あ行"' index.html
          grep -Fq '{ label: "わ行"' index.html
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-mobile-kana-grid.yml
          git commit -m "Use two-column mobile kana grid"
          git push origin main
