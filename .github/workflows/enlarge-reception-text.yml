name: Apply reception text sizing
"on":
  push:
    paths:
      - .github/workflows/enlarge-reception-text.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted CSS changes
        run: >-
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); a="    .name-option:hover,\n    .name-option:focus-visible { background: var(--primary-soft); }"; b="    .name-options--rows .name-option {\n      font-size: clamp(1.8rem, 4vw, 2.2rem);\n      line-height: 1.2;\n      white-space: nowrap;\n    }\n\n    .name-option:hover,\n    .name-option:focus-visible { background: var(--primary-soft); }"; assert s.count(a)==1; s=s.replace(a,b,1); a="    .name-option--candidate {\n      min-height: 72px;\n      color: var(--text);\n      font-size: 1.2rem;\n      text-align: left;\n    }"; b="    .name-option--candidate {\n      min-height: 72px;\n      color: var(--text);\n      font-size: clamp(1.55rem, 4vw, 2rem);\n      line-height: 1.25;\n      text-align: left;\n      white-space: nowrap;\n    }"; assert s.count(a)==1; s=s.replace(a,b,1); a="    #keypad-back,\n    #name-select-back {\n      display: block;\n      width: min(620px, 100%);\n      min-height: 58px;\n      margin: 16px auto 0;\n    }"; b=a+"\n\n    #keypad-back,\n    #name-select-back,\n    #access-admin-back,\n    #role-admin-back,\n    #confirm-no {\n      font-size: clamp(1.45rem, 3.2vw, 2rem);\n      line-height: 1.2;\n      white-space: nowrap;\n    }"; assert s.count(a)==1; s=s.replace(a,b,1); a="        font-size: clamp(1.2rem, 5vw, 1.6rem);"; b="        font-size: clamp(1.55rem, 6vw, 1.9rem);"; assert s.count(a)==1; s=s.replace(a,b,1); p.write_text(s)'
      - name: Verify targeted changes
        run: |
          grep -Fq 'font-size: clamp(1.8rem, 4vw, 2.2rem);' index.html
          grep -Fq 'font-size: clamp(1.55rem, 4vw, 2rem);' index.html
          grep -Fq 'font-size: clamp(1.45rem, 3.2vw, 2rem);' index.html
          grep -Fq 'font-size: clamp(1.55rem, 6vw, 1.9rem);' index.html
          grep -Fq '#access-admin-back,' index.html
          grep -Fq '#role-admin-back,' index.html
          grep -Fq '#confirm-no {' index.html
          grep -Fq 'grid-auto-flow: column;' index.html
          ! grep -Fq 'font-size: clamp(1.2rem, 5vw, 1.6rem);' index.html
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/enlarge-reception-text.yml
          git commit -m "Enlarge reception selection text"
          git push origin main
