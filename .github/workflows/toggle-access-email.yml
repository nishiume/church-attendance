name: Apply collapsible access email display
"on":
  push:
    paths:
      - .github/workflows/toggle-access-email.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted UI change
        run: >-
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); old="        const label = document.createElement(\"span\");\n        label.textContent = person.name;\n\n        const input = document.createElement(\"input\");\n        input.type = \"email\";\n        input.value = account.login_email || \"\";\n        input.disabled = true;\n        input.setAttribute(\"aria-label\", `${person.name}のGoogleメール`);"; new="        const label = document.createElement(\"button\");\n        label.type = \"button\";\n        label.className = \"access-name-button\";\n        label.textContent = person.name;\n        label.setAttribute(\"aria-expanded\", \"false\");\n\n        const input = document.createElement(\"input\");\n        input.type = \"email\";\n        input.value = account.login_email || \"\";\n        input.disabled = true;\n        input.hidden = true;\n        input.setAttribute(\"aria-label\", `${person.name}のGoogleメール`);\n        label.addEventListener(\"click\", () => {\n          input.hidden = !input.hidden;\n          label.setAttribute(\"aria-expanded\", String(!input.hidden));\n        });"; assert s.count(old)==1; s=s.replace(old,new); marker="    .access-name-actions { display: grid; grid-template-columns: minmax(0, 1fr) 5.5em; align-items: center; gap: 8px; width: 100%; }"; add=marker+"\n    .access-name-button { width: 100%; min-height: 0; padding: 0; border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 800; text-align: left; }"; assert s.count(marker)==1; s=s.replace(marker,add); p.write_text(s)'
      - name: Verify scope
        run: >-
          python -c 'from pathlib import Path; s=Path("index.html").read_text(); assert s.count("className = \"access-name-button\"")==1; assert s.count("input.hidden = true;")==1; assert "input.hidden = !input.hidden;" in s; assert "aria-expanded" in s; assert "grid-template-columns: minmax(0, 1fr) 5.5em" in s; assert "select.addEventListener(\"change\"" in s; assert "await sync.setAccess(Number(person.id), nextAllowed ? account.login_email : null);" in s'
      - name: Commit and self-delete
        run: >-
          git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add index.html && git rm .github/workflows/toggle-access-email.yml && git commit -m 'Hide reception emails until requested' && git push